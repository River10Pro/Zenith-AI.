<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Zenith AI Assistant</title>

<link rel="stylesheet" href="Styles.css">

<!-- Metas -->
<meta name="description" content="Zenith IA.">
<meta name="author" content="Mauro Rivera">
<meta name="keywords" content="Bot IA, Inteligencia Artificial">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

</head>
<body>
<!-- LOADING -->
<div id="loadingScreen">
    <div class="loader"></div>
    <h2>Iniciando Zenith AI...</h2>
</div>

<canvas id="aiBackground"></canvas>

<aside class="zenith-sidebar" id="zenithSidebar">
    <div class="brand">
        <div class="brand-mark">Z</div>
        <div>
            <strong>Zenith</strong>
            <span>AI Companion</span>
        </div>
    </div>
    <button class="new-chat-button" type="button" onclick="limpiarChat()">
        <span>＋</span> Nueva conversación
    </button>
    <div class="sidebar-section">
        <small>HISTORIAL</small>
        <button class="history-current" type="button" onclick="document.getElementById('chatBox').scrollTo({top:0,behavior:'smooth'})">
            <span class="history-dot"></span>
            Conversación actual
        </button>
    </div>
    <div class="sidebar-footer">
        <button class="profile-button" type="button" onclick="editarNombre()">
            <span class="profile-avatar" id="profileAvatar">A</span>
            <span>
                <strong id="profileName">Usuario</strong>
                <small>Zenith Personal</small>
            </span>
        </button>
    </div>
</aside>

<main class="ai-shell">
    <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
            <span class="status-dot"></span>
            <div>
                <strong>Zenith AI</strong>
                <small id="aiStatus">En línea</small>
            </div>
        </div>
        <button class="icon-button" id="themeButton" type="button" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
    </header>

    <section class="chat-stage">
        <div id="chatBox" class="chat-area"></div>
    </section>

    <section class="composer-wrap">
        <div class="quick-buttons">
            <button type="button" onclick="sendQuickMessage('Explícame una idea de forma sencilla')">✨ Explicar</button>
            <button type="button" onclick="sendQuickMessage('Ayúdame a crear una idea original')">💡 Crear</button>
            <button type="button" onclick="sendQuickMessage('¿Qué puedes hacer por mí?')">🧠 Capacidades</button>
        </div>
        <div id="imagePreview" class="image-preview-container" hidden></div>
        <div class="ai-input">
            <button class="action-button" id="imageButton" type="button" title="Adjuntar imagen" onclick="document.getElementById('imageInput').click()">＋</button>
            <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <button class="action-button" id="micButton" type="button" title="Hablar" aria-label="Hablar">🎙</button>
            <input id="messageInput" placeholder="Pregúntale a Zenith..." maxlength="4000" autocomplete="off">
            <button id="sendButton" type="button" onclick="sendMessage()" aria-label="Enviar mensaje">➤</button>
        </div>
        <small class="disclaimer">Zenith puede cometer errores. Revisa información importante.</small>
    </section>
</main>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<script>

const API_ENDPOINT = "https://zenith-ai-2.onrender.com/chat";
const CREATOR_NAME = "Andrew Rivera";

let userName = localStorage.getItem("userName");
let chatHistory = [];
let selectedImage = null;
let isSending = false;
let zenithMemory = localStorage.getItem("zenithMemory") || "";

/* ==============================
   LOADING
============================== */
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loadingScreen").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("loadingScreen").style.display = "none";
        }, 600);
    }, 1200);
});

/* ==============================
   USER NAME
============================== */
function checkUserName() {
    if (!userName || userName.trim() === "") {
        const enteredName = prompt("¡Hola! Soy Zenith AI. ¿Cómo te llamas?");
        userName = (enteredName || "amigo").trim().slice(0, 40) || "amigo";
        localStorage.setItem("userName", userName);
    }
    const profileName=document.getElementById("profileName");
    const profileAvatar=document.getElementById("profileAvatar");
    if(profileName) profileName.innerText=userName;
    if(profileAvatar) profileAvatar.innerText=userName.charAt(0).toUpperCase();
}
checkUserName();

function editarNombre(){
    const nuevoNombre=prompt("¿Cómo quieres que te llame?", userName);
    if(nuevoNombre && nuevoNombre.trim()){
        userName=nuevoNombre.trim().slice(0,40);
        localStorage.setItem("userName", userName);
        const profileName=document.getElementById("profileName");
        const profileAvatar=document.getElementById("profileAvatar");
        if(profileName) profileName.innerText=userName;
        if(profileAvatar) profileAvatar.innerText=userName.charAt(0).toUpperCase();
        showThought("Ahora te llamo "+userName+" 😎");
    }
    const nuevaMemoria=prompt(
        "¿Qué información importante debo recordar? Déjalo vacío para borrar la memoria.",
        zenithMemory
    );
    if(nuevaMemoria !== null){
        zenithMemory=nuevaMemoria.trim().slice(0,1000);
        if(zenithMemory) localStorage.setItem("zenithMemory",zenithMemory);
        else localStorage.removeItem("zenithMemory");
        showThought(zenithMemory ? "Memoria actualizada 🧠" : "Memoria borrada");
    }
}

/* ==============================
   RESTORE CHAT
============================== */
const saved = localStorage.getItem("chatHistory");
if (saved) {
    chatHistory = JSON.parse(saved);
    chatHistory.forEach(msg => {
        if (msg.role === "user") addUserMessage(msg.content);
        if (msg.role === "assistant") addBotMessage(msg.content);
    });
} else {
    chatHistory = [];
    addBotMessage(`¡Hola ${userName}! 👋 ¿En qué te ayudo hoy?`);
}

/* ==============================
   PARTICLES BACKGROUND
============================== */
const canvas = document.getElementById("aiBackground");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

class Particle {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x > canvas.width) this.x = 0;
        if(this.x < 0) this.x = canvas.width;
        if(this.y > canvas.height) this.y = 0;
        if(this.y < 0) this.y = canvas.height;
    }
    draw(){
    ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.9)`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;

    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size + 0.5,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0; // importante para que no afecte otras cosas
}
}

for(let i=0;i<80;i++){
    particles.push(new Particle());
}

let hue = 0;

function connectParticles() {
    for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
            let dx = particles[a].x - particles[b].x;
            let dy = particles[a].y - particles[b].y;
            let distance = dx * dx + dy * dy;

            if (distance < 8000) {
                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.08)`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function drawNebula() {
    let gradient = ctx.createRadialGradient(
        canvas.width / 2,
        canvas.height / 2,
        100,
        canvas.width / 2,
        canvas.height / 2,
        canvas.width / 1.2
    );

    gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.08)`);
    gradient.addColorStop(1, "transparent");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawNebula();

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    connectParticles();

    hue += 0.3;
    requestAnimationFrame(animate);
}
animate();

/* ==============================
   EMOCIONES Y ANIMACIONES
============================== */
function setEmotion(type){
    const mouth = document.getElementById("aiMouth");
    if(mouth) mouth.className = "ai-mouth " + type;
}


function moveEyes(){
    const eyes = document.querySelectorAll(".eye");
    eyes.forEach(eye=>{
        const x = (Math.random()-0.5)*4;
        const y = (Math.random()-0.5)*4;
        eye.style.transform = `translate(${x}px,${y}px)`;
    });
}
setInterval(moveEyes,2000);

/* ==============================
   CHAT FUNCTIONS
============================== */
function addUserMessage(text){
    let box = document.getElementById("chatBox");
    let msg = document.createElement("div");
    msg.classList.add("message","user");
    msg.innerText = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}

function addBotMessage(text, withCopy=false) {
    let box = document.getElementById("chatBox");
    let wrapper = document.createElement("div");
    wrapper.classList.add("bot-message");

    let avatar = document.createElement("div");
    avatar.classList.add("bot-avatar");
    avatar.innerText="🤖";

    let msg=document.createElement("div");
    msg.classList.add("message","bot");
    msg.innerText=text;

    if (withCopy) {
        let copy=document.createElement("button");
        copy.className="copy-message";
        copy.type="button";
        copy.innerText="Copiar";
        copy.onclick=async()=> {
            await navigator.clipboard.writeText(text);
            copy.innerText="Copiado";
            setTimeout(()=>copy.innerText="Copiar",1500);
        };
        msg.appendChild(document.createElement("br"));
        msg.appendChild(copy);
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(msg);
    box.appendChild(wrapper);
    box.scrollTop = box.scrollHeight;
}

function detectarEmocion(text){
    const t=text.toLowerCase();

    if(t.includes("feo")||t.includes("tonto")||t.includes("estupido")){
        setEmotion("angry");
        showThought("Eso fue grosero 😠");
    }
    else if(t.includes("gracias")||t.includes("genial")){
        setEmotion("happy");
        showThought("Me agradas 😎");
    }
    else{
        setEmotion("neutral");
    }
}

function sendQuickMessage(text){
    document.getElementById("messageInput").value=text;
    sendMessage();
}

function limpiarChat(){
    localStorage.removeItem("chatHistory");
    document.getElementById("chatBox").innerHTML="";
    chatHistory=[];
}
function showThought(text) {
    const bubble = document.getElementById("thoughtBubble");

    if (!bubble) return;

    bubble.innerText = text;
    bubble.classList.add("active");

    clearTimeout(bubble.timeout);

    bubble.timeout = setTimeout(() => {
        bubble.classList.remove("active");
    }, 3000);
}

/* ==============================
   SEND MESSAGE
============================== */
async function sendMessage(){
    if (isSending) return;
    let input=document.getElementById("messageInput");
    let text=input.value.trim();
    if(!text) return;
    if (text.length > 4000) {
        showThought("Mensaje demasiado largo");
        return;
    }

    addUserMessage(text);
    detectarEmocion(text);
    input.value="";
    isSending=true;
    document.getElementById("sendButton").disabled=true;
    document.getElementById("imageButton").disabled=true;

    // RESPUESTA DIRECTA SOBRE CREADOR
    if(text.toLowerCase().includes("quien te creo") ||
       text.toLowerCase().includes("quién te creó")){
        let reply=`Fui diseñado y desarrollado con dedicación por ${CREATOR_NAME}.`;
		 showThought("Orgulloso de mi creador 😎");
        setEmotion("happy");
       
        addBotMessage(reply);
        chatHistory.push({role:"user",content:text});
        chatHistory.push({role:"assistant",content:reply});
        localStorage.setItem("chatHistory",JSON.stringify(chatHistory));
        setEmotion("neutral");
        isSending=false;
        document.getElementById("sendButton").disabled=false;
        document.getElementById("imageButton").disabled=false;
        input.focus();
        return;
    }

    showThought("Pensando...");
    document.getElementById("aiAvatar")?.classList.add("thinking");
	setEmotion("happy");
    setEmotion("talking");
    document.getElementById("aiStatus").innerText="Pensando...";

    const typing=document.createElement("div");
    typing.classList.add("typing");
    typing.innerHTML="<span></span><span></span><span></span>";
    document.getElementById("chatBox").appendChild(typing);

    try{
        const response=await fetch(API_ENDPOINT,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                messages:[...chatHistory.slice(-20),{role:"user",content:text}],
                image:selectedImage,
                memory:zenithMemory
            })
        });

        typing.remove();

        const data=await response.json();
        if (!response.ok) {
            throw new Error(data.error || "No se pudo obtener una respuesta.");
        }
        let reply=data.reply ||
            (typeof data.choices?.[0]?.message?.content === "string"
                ? data.choices[0].message.content
                : Array.isArray(data.choices?.[0]?.message?.content)
                    ? data.choices[0].message.content
                        .filter(part => typeof part?.text === "string")
                        .map(part => part.text)
                        .join("\n")
                    : "");

        reply = reply?.trim();
        if (!reply) throw new Error("El proveedor respondió sin texto.");

        setEmotion("happy");
        showThought("Ya sé qué decir 😎");
        document.getElementById("aiStatus").innerText="En espera";

        addBotMessage(reply, true);
        speakZenithReply(reply);
        document.getElementById("aiAvatar")?.classList.remove("thinking");

        chatHistory.push({role:"user",content:text});
        chatHistory.push({role:"assistant",content:reply});
        localStorage.setItem("chatHistory",JSON.stringify(chatHistory));
        clearSelectedImage();

    }catch(error){
        typing.remove();
        setEmotion("angry");
        showThought("Error 😠");
        addBotMessage(error.message || "Error conectando con el servidor.");
        document.getElementById("aiAvatar")?.classList.remove("thinking");
        document.getElementById("aiStatus").innerText="En espera";
    }finally{
        isSending=false;
        document.getElementById("sendButton").disabled=false;
        document.getElementById("imageButton").disabled=false;
        input.focus();
    }

    function speakZenithReply(text){
        if(!("speechSynthesis" in window) || localStorage.getItem("zenithVoice") === "off") return;
        window.speechSynthesis.cancel();
        const speech=new SpeechSynthesisUtterance(text.slice(0,1200));
        speech.lang="es-ES";
        speech.rate=1;
        speech.pitch=1.05;
        window.speechSynthesis.speak(speech);
    }
}


document.getElementById("messageInput")
.addEventListener("keypress",e=>{
    if(e.key==="Enter") sendMessage();
});

document.getElementById("imageInput").addEventListener("change", (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
        showThought("Formato de imagen no compatible");
        event.target.value="";
        return;
    }
    if (file.size > 2 * 1024 * 1024) {
        showThought("La imagen supera 2 MB");
        event.target.value="";
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        selectedImage = reader.result;
        const preview = document.getElementById("imagePreview");
        preview.hidden=false;
        preview.innerHTML="";
        const wrapper=document.createElement("span");
        wrapper.className="preview-wrapper";
        const image=document.createElement("img");
        image.className="preview-image";
        image.src=selectedImage;
        const remove=document.createElement("button");
        remove.className="remove-image";
        remove.type="button";
        remove.innerText="×";
        remove.onclick=clearSelectedImage;
        wrapper.append(image,remove);
        preview.appendChild(wrapper);
    };
    reader.readAsDataURL(file);
});

function clearSelectedImage() {
    selectedImage=null;
    document.getElementById("imageInput").value="";
    document.getElementById("imagePreview").hidden=true;
    document.getElementById("imagePreview").innerHTML="";
}

const menuButton=document.getElementById("menuButton");
const zenithSidebar=document.getElementById("zenithSidebar");
const sidebarBackdrop=document.getElementById("sidebarBackdrop");

function setSidebar(open){
    zenithSidebar.classList.toggle("open",open);
    sidebarBackdrop.classList.toggle("open",open);
}

menuButton?.addEventListener("click",()=>setSidebar(true));
sidebarBackdrop?.addEventListener("click",()=>setSidebar(false));

const themeButton=document.getElementById("themeButton");
const savedTheme=localStorage.getItem("zenithTheme");
if(savedTheme==="light") document.body.classList.add("light-theme");

themeButton?.addEventListener("click",()=>{
    document.body.classList.toggle("light-theme");
    localStorage.setItem(
        "zenithTheme",
        document.body.classList.contains("light-theme") ? "light" : "dark"
    );
});

const micButton=document.getElementById("micButton");
const SpeechRecognition=window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
    const recognition=new SpeechRecognition();
    recognition.lang="es-ES";
    recognition.interimResults=false;
    recognition.continuous=false;

    micButton?.addEventListener("click",()=>{
        if(isSending) return;
        micButton.classList.add("listening");
        showThought("Te estoy escuchando...");
        recognition.start();
    });

    recognition.onresult=(event)=>{
        const text=event.results[0][0].transcript;
        document.getElementById("messageInput").value=text;
        sendMessage();
    };
    recognition.onend=()=>{
        micButton?.classList.remove("listening");
    };
    recognition.onerror=()=>{
        micButton?.classList.remove("listening");
        showThought("No pude escuchar tu voz");
    };
}else if(micButton){
    micButton.disabled=true;
    micButton.title="Reconocimiento de voz no disponible";
}

const bubble = document.getElementById("thoughtBubble");

if (bubble) {
    let lastThought = "";

function randomThought() {

    let random;

    if (document.getElementById("aiMouth").classList.contains("angry")) {
        random = "Estoy un poco molesto 😤";
    } else {
        do {
            random = thoughts[Math.floor(Math.random() * thoughts.length)];
        } while (random === lastThought);
    }

    lastThought = random;

    bubble.style.opacity = 0;

    setTimeout(() => {
        bubble.innerText = random;
        bubble.style.opacity = 1;
    }, 300);
}
randomThought();              // muestra una al cargar
    setInterval(randomThought, 10000);  // cambia cada 10 segundos

</script>
